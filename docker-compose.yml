version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/eufogrup_tasks
      - JWT_SECRET=dev_secret_change_in_production_min32chars
      - JWT_EXPIRE=15m
      - REFRESH_TOKEN_SECRET=dev_refresh_secret_change_in_production
      - REFRESH_TOKEN_EXPIRE=7d
      - NODE_ENV=production
      - PORT=3000
      - TZ=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eufogrup_tasks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
